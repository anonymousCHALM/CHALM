answer_llm:
  max_input_tokens: 4096
  max_new_tokens: 64
  model: Qwen/Qwen2.5-3B-Instruct
  provider: transformers_local
  revision: null
  temperature: 0.0
bounded_rag:
  capacity: 512
  max_context_chars: 12000
  max_text_bytes: 1024
  top_k: 8
dataset:
  examples: 100
  examples_by_horizon:
    100: 300
    500: 225
    1000: 150
    5000: 150
  name: synthetic
  train_seed: 1000
  turns:
  - 100
  - 500
  - 1000
  - 5000
  validation_seed: 2000
embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  provider: sentence_transformers
evaluation:
  agents:
  - bounded_rag
  paired_bootstrap_samples: 10000
  qa_batch_size: 1
execution:
  agents:
  - bounded_rag
  checkpoint: ./results/study/jobs/training/seed_7/attempts/attempt_002/training_artifacts/checkpoints/best.pt
  examples_per_horizon:
    100: 300
    500: 225
    1000: 150
    5000: 150
  horizons:
  - 100
  - 500
  - 1000
  - 5000
  smoke: false
linearrag_local:
  bridge_threshold: 0.4
  damping: 0.5
  hops: 3
  ner_model: en_core_web_sm
  passage_ratio: 2.0
  passage_weight: 0.05
  sentences_per_entity: 3
liquid:
  dt: 0.1
  lexical_bytes: 256
  lexical_memory:
    capacity: 512
    correction_cues:
    - 'correction:'
    - actually
    - instead
    - 'not '
    - 'now '
    - changed
    - currently
    - 'update:'
    enabled: true
    max_text_bytes: 1024
    prefix_scale: 0.1
    redundancy_threshold: 0.82
    top_k: 8
  prefix_tokens: 16
  slots: 8
  state_dim: 256
  storage_dtype: float32
  tau_max: 20.0
  tau_min: 0.1
protocol:
  fixed_evaluation_seed: 29001
  study: chalm
  training_seed: null
rag:
  index: flat_inner_product
  max_context_chars: 12000
  max_turn_chars: 2000
  top_k: 8
run:
  immutable: true
  output_root: ./results/study/jobs/main/synthetic/bounded_rag/attempts/attempt_001
  seed: 29001
run_kind: evaluation
simplemem_local:
  auxiliary_tokens: 256
  compression_batch_size: 4
  consolidation_minimum: 3
  consolidation_threshold: 0.85
  stride: 5
  window: 10
training:
  alignment_weight: 0.0
  correction_loss: true
  data_seed: 1000
  epochs: 5
  examples: 1500
  horizons:
  - 32
  - 64
  - 128
  - 256
  learning_rate: 0.0003
  lexical_context: true
