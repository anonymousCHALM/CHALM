answer_llm:
  max_input_tokens: 4096
  max_new_tokens: 64
  model: Qwen/Qwen2.5-3B-Instruct
  provider: transformers_local
  revision: null
  temperature: 0.0
bounded_rag:
  capacity: 512
  max_context_chars: 12000
  max_text_bytes: 1024
  top_k: 8
dataset:
  input: ./data/external/longmemeval/longmemeval_s_cleaned.json
  name: longmemeval
  preserve_question_dates: true
  preserve_session_dates: true
embedding:
  model: sentence-transformers/all-MiniLM-L6-v2
  provider: sentence_transformers
evaluation:
  agents:
  - chalm
  diagnostic_metrics:
  - token_f1
  - exact_answer_inclusion
  - gold_session_recall
  - evidence_coverage
  official_evaluator: external/LongMemEval/src/evaluation/evaluate_qa.py
  qa_batch_size: 1
execution:
  agents:
  - chalm
  checkpoint: ./results/final/raw/jobs/training/seed_29/attempts/attempt_003/training_artifacts/checkpoints/best.pt
  examples: 450
  lexical_top_k: 8
  prefix_scale: 0.1
  selection: contiguous
  selection_seed: null
  shared_history_reuse: false
  smoke: false
  start_index: 50
linearrag_local:
  bridge_threshold: 0.4
  damping: 0.5
  hops: 3
  ner_model: en_core_web_sm
  passage_ratio: 2.0
  passage_weight: 0.05
  sentences_per_entity: 3
liquid:
  dt: 0.1
  lexical_bytes: 256
  lexical_memory:
    capacity: 512
    correction_cues:
    - 'correction:'
    - actually
    - instead
    - 'not '
    - 'now '
    - changed
    - currently
    - 'update:'
    enabled: true
    max_text_bytes: 1024
    prefix_scale: 0.1
    redundancy_threshold: 0.82
    replacement_rule: newest_wins
    top_k: 8
  prefix_tokens: 16
  slots: 8
  state_dim: 256
  storage_dtype: float32
  tau_max: 20.0
  tau_min: 0.1
protocol:
  agent: chalm
  correction_style: original
  dataset: longmemeval
  evaluation_seed: 7
  group: newest-wins-original
  horizons: null
  project: CHALM
  replacement_rule: newest_wins
  training_seed: 29
  version: 1
rag:
  index: flat_inner_product
  max_context_chars: 12000
  max_turn_chars: 2000
  top_k: 8
run:
  immutable: true
  output_root: ./results/followup_study/jobs/c4739b08c2e3/runs
  seed: 7
run_kind: evaluation
training:
  alignment_weight: 0.0
  correction_loss: true
  epochs: 5
  examples: 1500
  horizons:
  - 32
  - 64
  - 128
  - 256
  learning_rate: 0.0003
  lexical_context: true
